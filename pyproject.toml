[project]
name = "pptx-jahat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arush", email = "arush221617@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "openai>=1.65.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "pillow>=11.1.0",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pywin32>=312",
    "comtypes>=1.4.16",
]

[project.scripts]
pptx-jahat = "pptx_jahat:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
